<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#101c34">
  <title>Finanzas · Presupuesto</title>
  <link rel="icon" type="image/png" href="src/assets/favicon.png">
  <link rel="stylesheet" href="MAESTRO.css">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('fm-theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="root"></div>

  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <div id="file-warning" hidden style="padding:2rem;font-family:sans-serif">
    Abre esta página con un servidor local (por ejemplo <code>npx serve .</code>), no con <code>file://</code>.
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="MAESTRO.js"></script>
  <script src="MAESTRO.bancos.js"></script>
  <script type="text/babel" data-presets="react" src="MAESTRO.jsx"></script>
</body>
</html>
