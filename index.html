<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Webapp Standalone tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#101c34">
  <title>Financial Budget Dashboard - Finanzas</title>
  <link rel="icon" type="image/png" href="src/assets/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos Maestros -->
  <link rel="stylesheet" href="MAESTRO.css">

  <!-- Dependencias de React 18 y Babel Standalone para transpilar JSX en el navegador -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>
</head>
<body>
  <!-- Contenedor Raíz de React -->
  <div id="root">
    <div style="min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; font-family: 'Outfit', sans-serif;">
      <div class="spin-loader"></div>
      <div style="font-size: 18px; font-weight: 600; color: #1e293b;">Cargando Financial Budget Dashboard...</div>
      <div style="font-size: 13px; margin-top: 6px; color: #64748b;">Inicializando motor de cálculo y componentes React</div>
    </div>
  </div>

  <!-- 1. Motor Maestro de Datos, Cálculos y Conexión Cloud -->
  <script src="MAESTRO.js"></script>

  <!-- 2. Aplicación Maestra en React (JSX) -->
  <script type="text/babel" src="MAESTRO.jsx"></script>

  <!-- Script de detección para protocolo file:// con instrucciones en caso de bloqueo CORS local del navegador -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.querySelector('.spin-loader')) {
          if (window.location.protocol === 'file:') {
            root.innerHTML = `
              <div style="max-width: 620px; margin: 80px auto; padding: 30px; background: #ffffff; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 16px; color: #1e293b; font-family: 'Outfit', sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                  <span style="font-size: 28px;">💡</span>
                  <h2 style="margin: 0; font-size: 20px; color: #d97706;">Apertura local detectada (file://)</h2>
                </div>
                <p style="color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 16px;">
                  Has abierto el archivo directamente desde el explorador de archivos. Los navegadores modernos bloquean la lectura de archivos <code>.jsx</code> externos bajo <code>file:///</code> por seguridad CORS.
                </p>
                <div style="background: #f8fafc; padding: 14px 18px; border-radius: 8px; border: 1px solid #e2e8f0; font-family: monospace; font-size: 13px; margin-bottom: 16px;">
                  <div style="color: #64748b; margin-bottom: 6px;">// Para correr localmente abre la terminal en esta carpeta y ejecuta:</div>
                  <div style="color: #0284c7; font-weight: bold;">npx serve .</div>
                  <div style="color: #64748b; margin-top: 8px; margin-bottom: 6px;">// O con la extensión Live Server de VS Code:</div>
                  <div style="color: #10b981; font-weight: bold;">Clic derecho en index.html → "Open with Live Server"</div>
                </div>
                <p style="color: #64748b; font-size: 13px; line-height: 1.5; margin: 0;">
                  En producción (Vercel, GitHub Pages) o cualquier servidor HTTP local, la aplicación carga de forma instantánea.
                </p>
              </div>
            `;
          }
        }
      }, 2500);
    });
  </script>
</body>
</html>
